name: Contribution snake

on:
  schedule:
    - cron: "30 18 * * *" # daily, midnight IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#ea580c&color_dots=#ebedf0,#c7d2fe,#93a5e8,#fdba74,#ea580c
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff9a3c&color_dots=#161b22,#1b2a52,#2f4a8a,#c2410c,#ff9a3c

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
