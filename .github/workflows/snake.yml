name: Contribution snake

on:
  schedule:
    - cron: "30 18 * * *" # daily, midnight IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/snake.yml]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#B8923A&color_dots=#F3EEE3,#F6DFA9,#EDC46F,#C9993F,#8A6A30
            dist/snake-dark.svg?palette=github-dark&color_snake=#E2BE6A

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
