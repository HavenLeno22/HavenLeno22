name: Contribution sky

on:
  schedule:
    - cron: "30 18 * * *" # daily, midnight IST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/sky.yml, scripts/contrib-sky.mjs]

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Draw the last year of contributions as a night sky
        run: node scripts/contrib-sky.mjs ${{ github.repository_owner }} dist/contrib-sky.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
