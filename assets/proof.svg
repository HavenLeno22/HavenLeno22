<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 460" role="img" aria-labelledby="title desc">
  <title id="title">Professional proof points for Haven Leno J</title>
  <desc id="desc">A moonlit terminal panel highlighting Sensora 2.0 recognition, a GenLab MERN internship, Smart India Hackathon team leadership, and selected work in safety, learning, and real-time systems.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1d35"/>
      <stop offset="0.58" stop-color="#091321"/>
      <stop offset="1" stop-color="#10192d"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#142947"/>
      <stop offset="1" stop-color="#0c1729"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="0.62" stop-color="#c8d4e8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#8fa3bf" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="1598" height="458" rx="30" fill="url(#surface)" stroke="#344b6b" stroke-width="2"/>
  <path d="M32 68H1568" stroke="#344b6b" stroke-width="2"/>
  <circle cx="48" cy="35" r="8" fill="#ef6a61"/>
  <circle cx="74" cy="35" r="8" fill="#edbe55"/>
  <circle cx="100" cy="35" r="8" fill="#55c775"/>
  <text x="800" y="43" text-anchor="middle" fill="#b8c8df" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" font-weight="700">haven@portfolio: ~/proof</text>
  <text x="1508" y="43" text-anchor="end" fill="#d8bd82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700">HLJ</text>

  <circle cx="1482" cy="138" r="92" fill="url(#moon)" opacity="0.72"/>
  <circle cx="1482" cy="138" r="44" fill="#d8e1f0" opacity="0.13"/>
  <path d="M1387 138h190M1482 43v190" stroke="#d8bd82" stroke-width="1" opacity="0.22"/>
  <path d="M1320 225C1390 181 1490 190 1570 229" fill="none" stroke="#d8bd82" stroke-width="1.5" opacity="0.25"/>

  <text x="56" y="122" fill="#d8bd82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="800" letter-spacing="3">// PROOF</text>
  <text x="56" y="153" fill="#e8effb" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="28" font-weight="700">Signals of work that has moved beyond the idea stage.</text>

  <g transform="translate(56 190)">
    <rect width="350" height="210" rx="18" fill="url(#card)" stroke="#2f496c" stroke-width="1.5"/>
    <rect x="24" y="25" width="8" height="42" rx="4" fill="#d8bd82" filter="url(#glow)"/>
    <text x="48" y="43" fill="#aebfda" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="2">RECOGNITION</text>
    <text x="24" y="111" fill="#f4f7ff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="31" font-weight="750">Sensora 2.0</text>
    <text x="24" y="143" fill="#c2d0e5" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18">Implementation recognition</text>
    <text x="24" y="170" fill="#8fa4c4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">VIT Vellore</text>
  </g>

  <g transform="translate(426 190)">
    <rect width="350" height="210" rx="18" fill="url(#card)" stroke="#2f496c" stroke-width="1.5"/>
    <rect x="24" y="25" width="8" height="42" rx="4" fill="#8faee0"/>
    <text x="48" y="43" fill="#aebfda" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="2">EXPERIENCE</text>
    <text x="24" y="111" fill="#f4f7ff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="31" font-weight="750">GenLab</text>
    <text x="24" y="143" fill="#c2d0e5" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18">MERN internship</text>
    <text x="24" y="170" fill="#8fa4c4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">Summer 2026</text>
  </g>

  <g transform="translate(796 190)">
    <rect width="350" height="210" rx="18" fill="url(#card)" stroke="#2f496c" stroke-width="1.5"/>
    <rect x="24" y="25" width="8" height="42" rx="4" fill="#77c9b0"/>
    <text x="48" y="43" fill="#aebfda" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="2">LEADERSHIP</text>
    <text x="24" y="111" fill="#f4f7ff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="31" font-weight="750">SIH 2026</text>
    <text x="24" y="143" fill="#c2d0e5" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="18">Led a team of 6</text>
    <text x="24" y="170" fill="#8fa4c4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">Smart India Hackathon</text>
  </g>

  <g transform="translate(1166 190)">
    <rect width="350" height="210" rx="18" fill="url(#card)" stroke="#2f496c" stroke-width="1.5"/>
    <rect x="24" y="25" width="8" height="42" rx="4" fill="#e2a568"/>
    <text x="48" y="43" fill="#aebfda" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="2">SELECTED WORK</text>
    <text x="24" y="106" fill="#f4f7ff" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="29" font-weight="750">Useful systems</text>
    <text x="24" y="140" fill="#c2d0e5" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="17">Safety · learning · real-time</text>
    <text x="24" y="170" fill="#8fa4c4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">Built to be used</text>
  </g>
</svg>
